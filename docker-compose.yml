# Shoeshine API Server - Docker Compose
# For local OCR testing (LLM via AWS Bedrock)

services:
  shoeshine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoeshine-api
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - SHOESHINE_HOST=0.0.0.0
      - SHOESHINE_PORT=8000
      - SHOESHINE_ENV=local

      # AWS Bedrock (configure credentials for LLM features)
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}

      # Disable PaddleOCR model check warning
      - PADDLEX_DISABLE_MODEL_SOURCE_CHECK=True

      # Logging
      - SHOESHINE_LOG_LEVEL=info

    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shoeshine-network

networks:
  shoeshine-network:
    driver: bridge
