# Shoeshine API Server - Docker Compose
# For local development and testing with Ollama

version: '3.8'

services:
  shoeshine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoeshine-api
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - SHOESHINE_HOST=0.0.0.0
      - SHOESHINE_PORT=8000
      - SHOESHINE_MAX_FILE_SIZE=10
      - SHOESHINE_ENV=local

      # API Key authentication (disabled by default for local dev)
      - SHOESHINE_REQUIRE_API_KEY=false

      # Ollama configuration
      - SHOESHINE_OLLAMA_URL=http://ollama:11434
      - SHOESHINE_LLM_MODEL=llama3

      # OCR Configuration
      - SHOESHINE_DEFAULT_OCR_ENGINE=easyocr
      - SHOESHINE_OCR_IDLE_TIMEOUT=600

      # Disable PaddleOCR model check warning
      - PADDLEX_DISABLE_MODEL_SOURCE_CHECK=True

      # Logging
      - SHOESHINE_LOG_LEVEL=info

    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shoeshine-network
    depends_on:
      - ollama
    # GPU support (uncomment for NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: shoeshine-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - shoeshine-network
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_GPU_LAYERS=35  # Use GPU if available
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # GPU support for Ollama (uncomment for NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional: Web UI for Ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: shoeshine-webui
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - webui-data:/app/backend/data
    restart: unless-stopped
    networks:
      - shoeshine-network
    depends_on:
      - ollama

networks:
  shoeshine-network:
    driver: bridge

volumes:
  ollama-data:
  webui-data:
