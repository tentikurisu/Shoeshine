name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get ECR repository URI
        id: ecr-repo
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPO_URI="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION || 'eu-west-1' }}.amazonaws.com/shoeshine"
          echo "repository_uri=$REPO_URI" >> $GITHUB_OUTPUT

      - name: Build Lambda image
        run: |
          docker build -f Dockerfile.lambda \
            -t ${{ steps.ecr-repo.outputs.repository_uri }}:latest \
            -t ${{ steps.ecr-repo.outputs.repository_uri }}:${{ github.sha }} \
            .

      - name: Push to ECR
        run: |
          docker push ${{ steps.ecr-repo.outputs.repository_uri }}:latest
          docker push ${{ steps.ecr-repo.outputs.repository_uri }}:${{ github.sha }}
