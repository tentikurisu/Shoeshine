name: Deploy Docker Image

on:
  push:
    tags:
      - "v*"
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'owner/repo'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push multi-arch images
        run: |
          docker buildx build --platform linux/amd64 --tag ${{ secrets.DOCKER_USERNAME }}/shoeshine-api:latest .
          docker buildx build --platform linux/arm64 --tag ${{ secrets.DOCKER_USERNAME }}/shoeshine-api:arm64:latest .
          docker buildx build --platform linux/amd64 --tag ${{ secrets.DOCKER_USERNAME }}/shoeshine-api:amd64:${{ github.sha }} .
          docker buildx build --platform linux/arm64 --tag ${{ secrets.DOCKER_USERNAME }}/shoeshine-api:arm64:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/shoeshine-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/shoeshine-api-amd64:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/shoeshine-api-arm64:${{ github.sha }}
