name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Lint with ruff
        run: |
          ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=docker-container-registry.github.com/gcr.io/buildkit/buildx:latest
            platforms: linux/amd64,linux/arm64
          
      - name: Build Docker image
        run: |
          docker buildx build --platform linux/amd64 -t shoeshine-amd64:latest .
          docker buildx build --platform linux/arm64 -t shoeshine-arm64:latest .
          
      - name: List Docker images
        run: |
          docker images | grep shoeshine
