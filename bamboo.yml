version: 2
plan:
  project-key: SHOESHINE
  key: LAMBDA
  name: Shoeshine Lambda Deployment

stages:
  - Build:
      jobs:
        - BuildImage
  - Test:
      jobs:
        - RunTests
  - Infrastructure:
      jobs:
        - TerraformApply
  - Deploy:
      jobs:
        - DeployLambda
  - Validate:
      jobs:
        - SmokeTest

jobs:
  - BuildImage:
      key: BuildImage
      description: Build and push Docker image to ECR
      tasks:
        - checkout
        - script:
            key: BuildDocker
            description: Build and push Docker image to ECR
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                docker build -t shoeshine:latest -f Dockerfile.lambda .
                AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                AWS_REGION=${bamboo.aws_region:-eu-west-2}
                ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${bamboo.ecr_repo_name:-shoeshine}"
                docker tag shoeshine:latest ${ECR_REPO}:latest
                docker tag shoeshine:latest ${ECR_REPO}:bamboo-${bamboo.planRepository.revision}
                aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REPO}
                docker push ${ECR_REPO}:latest
                docker push ${ECR_REPO}:bamboo-${bamboo.planRepository.revision}

  - RunTests:
      key: RunTests
      description: Run unit and integration tests
      tasks:
        - checkout
        - script:
            key: RunPytest
            description: Run pytest tests
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                python -m pytest tests/ -v --tb=short

  - TerraformApply:
      key: TerraformApply
      description: Apply Terraform infrastructure using Docker container
      tasks:
        - checkout:
            path: infra/terraform
        - script:
            key: SetPermissions
            description: Set directory permissions for Docker
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                chmod -R 777 infra/terraform
        - script:
            key: BuildTerraformImage
            description: Build Terraform Docker image
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                cd infra/terraform
                docker build -t local:terraform .
        - script:
            key: TerraformInitDocker
            description: Run Terraform init in Docker container
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                cd infra/terraform
                docker run --rm -v $(pwd):/app -w /app local:terraform terraform init
        - script:
            key: TerraformPlanDocker
            description: Run Terraform plan in Docker container
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                cd infra/terraform
                docker run --rm -v $(pwd):/app -w /app \
                  -e AWS_ACCESS_KEY_ID=${bamboo.aws_access_key} \
                  -e AWS_SECRET_ACCESS_KEY=${bamboo.aws_secret_key} \
                  -e AWS_REGION=${bamboo.aws_region:-eu-west-2} \
                  local:terraform \
                  terraform plan \
                    -var="aws_region=${bamboo.aws_region:-eu-west-2}" \
                    -var="environment=${bamboo.environment:-production}" \
                    -var="api_key=${bamboo.api_key}" \
                    -var="bedrock_model_id=${bamboo.bedrock_model_id}" \
                    -out=tfplan
        - script:
            key: TerraformApplyDocker
            description: Run Terraform apply in Docker container
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                cd infra/terraform
                docker run --rm -v $(pwd):/app -w /app \
                  -e AWS_ACCESS_KEY_ID=${bamboo.aws_access_key} \
                  -e AWS_SECRET_ACCESS_KEY=${bamboo.aws_secret_key} \
                  -e AWS_REGION=${bamboo.aws_region:-eu-west-2} \
                  local:terraform \
                  terraform apply -auto-approve tfplan

  - DeployLambda:
      key: DeployLambda
      description: Deploy Lambda function
      tasks:
        - script:
            key: UpdateLambda
            description: Update Lambda with new Docker image
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                AWS_REGION=${bamboo.aws_region:-eu-west-2}
                LAMBDA_FUNC_NAME=${bamboo.lambda_func_name:-shoeshine-lambda}
                ECR_REPO="${bamboo.aws_account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${bamboo.ecr_repo_name:-shoeshine}"
                aws lambda update-function-code \
                  --function-name ${LAMBDA_FUNC_NAME} \
                  --image-uri ${ECR_REPO}:latest \
                  --region ${AWS_REGION}
                aws lambda wait function-updated \
                  --function-name ${LAMBDA_FUNC_NAME} \
                  --region ${AWS_REGION}

  - SmokeTest:
      key: SmokeTest
      description: Verify deployment with health check
      tasks:
        - script:
            key: HealthCheck
            description: Check API health endpoint
            interpreter: bash
            scripts:
              - |
                #!/bin/bash
                set -e
                API_ENDPOINT=${bamboo.api_endpoint}
                sleep 30
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${API_ENDPOINT}/health)
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "Health check passed: ${HTTP_CODE}"
                else
                  echo "Health check failed: ${HTTP_CODE}"
                  exit 1
                fi
