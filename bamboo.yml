version: 2

plan:
  project-key: SHOESHINE
  key: LAMBDA
  name: Shoeshine Lambda Deployment

stages:
  - Build:
      jobs:
        - BUILD
  - Test:
      jobs:
        - TEST
  - Infrastructure:
      jobs:
        - TFAP
  - Deploy:
      jobs:
        - DEPL
  - Validate:
      jobs:
        - SMOK

jobs:
  - Build Image:
      key: BUILD
      description: Build and push Docker image to ECR
      tasks:
        - checkout
        - script:
            description: Build and push Docker image to ECR
            interpreter: BINSH_OR_CMDEXE
            scripts:
              - |
                set -e
                docker build -t shoeshine:latest -f Dockerfile.lambda .

                AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                AWS_REGION=${bamboo.aws_region}
                ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${bamboo.ecr_repo_name}"

                docker tag shoeshine:latest ${ECR_REPO}:latest
                docker tag shoeshine:latest ${ECR_REPO}:bamboo-${bamboo.planRepository.revision}

                aws ecr get-login-password --region ${AWS_REGION} | \
                  docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

                docker push ${ECR_REPO}:latest
                docker push ${ECR_REPO}:bamboo-${bamboo.planRepository.revision}

  - Run Tests:
      key: TEST
      description: Run unit and integration tests
      tasks:
        - checkout
        - script:
            description: Run pytest
            interpreter: BINSH_OR_CMDEXE
            scripts:
              - |
                set -e
                python -m pytest tests/ -v --tb=short

  - Terraform Apply:
      key: TFAP
      description: Apply Terraform infrastructure using Docker container
      tasks:
        - checkout
        - script:
            description: Terraform init/plan/apply in Docker
            interpreter: BINSH_OR_CMDEXE
            scripts:
              - |
                set -e
                cd infra/terraform
                docker build -t local:terraform .

                docker run --rm \
                  -v "$(pwd)":/app \
                  -w /app \
                  -e AWS_ACCESS_KEY_ID=${bamboo.aws_access_key} \
                  -e AWS_SECRET_ACCESS_KEY=${bamboo.aws_secret_key} \
                  -e AWS_REGION=${bamboo.aws_region} \
                  local:terraform terraform init

                docker run --rm \
                  -v "$(pwd)":/app \
                  -w /app \
                  -e AWS_ACCESS_KEY_ID=${bamboo.aws_access_key} \
                  -e AWS_SECRET_ACCESS_KEY=${bamboo.aws_secret_key} \
                  -e AWS_REGION=${bamboo.aws_region} \
                  local:terraform terraform plan \
                    -var="aws_region=${bamboo.aws_region}" \
                    -var="environment=${bamboo.environment}" \
                    -var="api_key=${bamboo.api_key}" \
                    -var="bedrock_model_id=${bamboo.bedrock_model_id}" \
                    -out=tfplan

                docker run --rm \
                  -v "$(pwd)":/app \
                  -w /app \
                  -e AWS_ACCESS_KEY_ID=${bamboo.aws_access_key} \
                  -e AWS_SECRET_ACCESS_KEY=${bamboo.aws_secret_key} \
                  -e AWS_REGION=${bamboo.aws_region} \
                  local:terraform terraform apply -auto-approve tfplan

  - Deploy Lambda:
      key: DEPL
      description: Deploy Lambda function
      tasks:
        - checkout
        - script:
            description: Update Lambda to latest ECR image
            interpreter: BINSH_OR_CMDEXE
            scripts:
              - |
                set -e
                AWS_REGION=${bamboo.aws_region}
                LAMBDA_FUNC_NAME=${bamboo.lambda_func_name}
                ECR_REPO="${bamboo.aws_account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${bamboo.ecr_repo_name}"

                aws lambda update-function-code \
                  --function-name ${LAMBDA_FUNC_NAME} \
                  --image-uri ${ECR_REPO}:latest \
                  --region ${AWS_REGION}

                aws lambda wait function-updated \
                  --function-name ${LAMBDA_FUNC_NAME} \
                  --region ${AWS_REGION}

  - Smoke Test:
      key: SMOK
      description: Verify deployment with health check
      tasks:
        - checkout
        - script:
            description: Health check
            interpreter: BINSH_OR_CMDEXE
            scripts:
              - |
                set -e
                sleep 30
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${bamboo.api_endpoint}/health)
                test "$HTTP_CODE" = "200"
